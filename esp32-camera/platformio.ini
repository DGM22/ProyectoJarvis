; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<diag_main.cpp> -<button_test.cpp> -<audio_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    links2004/WebSockets@2.4.1
    olikraus/U8g2@2.36.18

monitor_speed = 115200
upload_speed = 921600

upload_port = /dev/cu.usbmodem5C930539171
monitor_port = /dev/cu.usbmodem5C930539171

monitor_dtr = 0
monitor_rts = 0

; Diagnóstico de OLED, botón, micrófono I2S y MAX98357A. No incluye la cámara.
;   pio run -e diag -t upload && pio device monitor -e diag
[env:diag]
extends = env:freenove
build_src_filter = -<*> +<diag_main.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -O2

; Prueba del botón (GPIO 14/38/2 a GND) + ojos en la OLED. Sin cámara ni WiFi.
;   pio run -e btntest -t upload && pio device monitor -e btntest
[env:btntest]
extends = env:freenove
build_src_filter = -<*> +<button_test.cpp> +<robot_eyes.cpp>

; Test de audio aislado: mic (pines normales/cruzados), tonos sin y con WiFi,
; medidor del mic en vivo. Sin cámara ni backend.
;   pio run -e audiotest -t upload && pio device monitor -e audiotest
[env:audiotest]
extends = env:freenove
build_src_filter = -<*> +<audio_test.cpp>
