; Prueba aislada del MAX98357A + bocina (y loopback con el INMP441).
;   cd esp32-tests/speaker-test
;   ./tools/make_voice.sh "Hola, soy Jarvis"        # genera data/voz.wav
;   ./tools/convert_audio.sh ~/Downloads/cancion.mp4 musica   # data/musica.wav
;   pio run -t uploadfs        # sube los .wav de data/ a la flash
;   pio run -t upload && pio device monitor

[env:speaker-test]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.arduino.memory_type = qio_opi
; 5.5 MB de flash para audio (~170 s de voz a 16 kHz mono).
board_build.partitions = large_spiffs_8MB.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    ; Reusa el WiFi de esp32-camera/src/secrets.h para la prueba de interferencia.
    -I../../esp32-camera/src

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C930539171
monitor_port = /dev/cu.usbmodem5C930539171
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter
monitor_echo = yes
