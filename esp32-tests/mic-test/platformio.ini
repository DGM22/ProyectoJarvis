; Prueba aislada del micrófono INMP441 (sin cámara, WiFi ni backend).
;   cd esp32-tests/mic-test
;   pio run -t upload && pio device monitor

[env:mic-test]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C930539171
monitor_port = /dev/cu.usbmodem5C930539171
monitor_dtr = 0
monitor_rts = 0
; Lo que escribes en el monitor se manda al presionar Enter (comandos).
monitor_filters = send_on_enter
monitor_echo = yes
