# Jarvis ESP32-S3 (Waveshare e-paper 1.54) — PlatformIO + ESP-IDF.
#   pio run -t upload        compilar y flashear
#   pio device monitor       logs
#   pio run -t menuconfig    Jarvis Device → WiFi, MAC, backend, token
#
# WiFi/token viven en `sdkconfig` (gitignored); `sdkconfig.local` solo
# siembra valores cuando `sdkconfig` no existe.
[env:waveshare-epaper-154]
; 6.13.0 = ESP-IDF 5.5.3. La 7.x trae IDF 6 y exige migrar drivers.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Mismo archivo que usa `idf.py`, así ambos flujos comparten la config.
board_build.esp-idf.sdkconfig_path = sdkconfig

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
