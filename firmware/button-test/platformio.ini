; Diagnóstico de botón en la Freenove ESP32-S3: detecta en qué GPIO está,
; si va a GND o a 3V3 y cuenta clicks (OLED en SDA 41 / SCL 42 + serial).
;   pio run -t upload && pio device monitor
[env:freenove]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.arduino.memory_type = qio_opi

lib_deps =
    olikraus/U8g2@2.36.18

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C930539171
monitor_port = /dev/cu.usbmodem5C930539171
monitor_dtr = 0
monitor_rts = 0
