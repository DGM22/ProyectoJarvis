; Escáner I2C para probar la OLED en la Freenove ESP32-S3 (SDA 41, SCL 42).
;   pio run -t upload && pio device monitor
[env:freenove]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C930539171
monitor_port = /dev/cu.usbmodem5C930539171
monitor_dtr = 0
monitor_rts = 0
